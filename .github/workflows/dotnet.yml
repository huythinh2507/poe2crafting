name: .NET tests

on:
  push:
    branches: [main]
    paths: ['dotnet/**', 'public/data/**', '.github/workflows/dotnet.yml']
  pull_request:
    paths: ['dotnet/**', 'public/data/**', '.github/workflows/dotnet.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test dotnet/Poe2Crafting.sln --nologo
